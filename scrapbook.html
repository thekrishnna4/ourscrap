<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Digital Scrapbook</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Interact.js for Mobile Touch Dragging and Resizing -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- YOUR FIREBASE CONFIGURATION ---
    const firebaseConfig = {
  apiKey: "AIzaSyA4sRJWhiHLrLuZbOjMu5mHlr9zvVmJb2s",
  authDomain: "scrapbook-ba4cf.firebaseapp.com",
  projectId: "scrapbook-ba4cf",
  storageBucket: "scrapbook-ba4cf.firebasestorage.app",
  messagingSenderId: "657531881443",
  appId: "1:657531881443:web:6a561ab17133f04b6002d6",
  measurementId: "G-N8R7GS2NCG"
};

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    window.scrapbookDB = { database, ref, onValue, set };
  </script>

  <style>
    :root {
      --bg-color: #f7e8ea;
      --card-bg: #ffffff;
      --text-main: #2b2526;
      --text-muted: #7e6f71;
      --accent-pink: #e29ca3;
      --border-color: #ebd3d6;
      --line-blue: #c4dbe0;
      --margin-pink: #f2b3b8;
      
      /* Palette from your image reference */
      --palette-coral: #E85D4E;
      --palette-amber: #F4A261;
      --palette-yellow: #F4E285;
      --palette-skyblue: #89B4C4;
      --palette-slate: #2B4C6F;

      --font-body: 'Inter', sans-serif;
      --font-hand: 'Caveat', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    /* Top Control Bar */
    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 12px 4px;
      z-index: 10;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .sync-badge {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    /* Book Container with 3D Page Turn Perspective */
    .notebook-wrapper {
      width: 100%;
      max-width: 420px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1200px;
      margin: 10px 0;
    }

    /* Book Page Base */
    .book-page {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(180, 130, 135, 0.25);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.4s ease;
    }

    /* Page Turn Animation Class */
    .page-turning {
      transform: rotateY(-90deg) scale(0.95);
      opacity: 0.2;
    }

    /* --- COVER PAGE STYLES (Page 0) --- */
    .cover-content {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fcedef 0%, #f7d6db 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .cover-photo-wrapper {
      width: 200px;
      aspect-ratio: 1/1;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 24px rgba(226, 156, 163, 0.3);
      margin-bottom: 24px;
    }

    .cover-photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-title {
      font-family: var(--font-hand);
      font-size: 2.4rem;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .color-dots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    /* --- LINED NOTEBOOK PAGE STYLES --- */
    .notebook-sheet {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
      background-image: 
        linear-gradient(to right, transparent 36px, var(--margin-pink) 36px, var(--margin-pink) 38px, transparent 38px),
        linear-gradient(to bottom, transparent 27px, var(--line-blue) 28px);
      background-size: 100% 28px;
      padding-left: 44px;
      padding-right: 12px;
      padding-top: 28px;
    }

    .notebook-sheet.active {
      display: block;
    }

    .notebook-text {
      width: 100%;
      height: calc(100% - 60px);
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-hand);
      font-size: 1.55rem;
      line-height: 28px;
      color: #2c2829;
      resize: none;
      white-space: pre-wrap;
    }

    /* Draggable/Resizable Photos */
    .scrapbook-photo {
      position: absolute;
      top: 40px;
      left: 60px;
      width: 130px;
      background: #ffffff;
      padding: 6px 6px 24px 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      border: 1px solid #eaeaea;
      touch-action: none;
      user-select: none;
      z-index: 5;
    }

    .scrapbook-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    .btn-delete-photo {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      background: #ff5c5c;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }

    /* Audio Widget */
    .audio-widget {
      position: absolute;
      bottom: 12px;
      left: 44px;
      right: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .audio-filename {
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Toolbar & Navigation */
    .bottom-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0;
    }

    .tool-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-tool {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .btn-tool:active {
      transform: scale(0.97);
      background-color: #f7eded;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-nav {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 46px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .page-indicator {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">

    <div class="sync-badge" id="syncStatus">☁️ Synced</div>
  </div>

  <!-- Notebook Book Container -->
  <div class="notebook-wrapper">
    <div class="book-page" id="bookPage">
      
      <!-- COVER PAGE (Page 0) -->
      <div class="notebook-sheet active" id="sheet-0">
        <div class="cover-content">
          <div class="cover-photo-wrapper">
            <img src="coverp.jpeg" alt="Cover Photo">

          <div class="color-dots">
            <div class="dot" style="background: var(--palette-coral);"></div>
            <div class="dot" style="background: var(--palette-amber);"></div>
            <div class="dot" style="background: var(--palette-yellow);"></div>

          <span>🎵</span>
          <span class="audio-filename">No audio attached</span>
          <label class="btn-tool" style="padding: 3px 8px; font-size: 0.7rem;">
            Upload
            <input type="file" class="audioInput" accept="audio/*" style="display: none;">
          </label>
          <button class="btn-tool btnPlay" style="padding: 3px 8px; font-size: 0.7rem;" disabled>Play</button>
        </div>
      </div>

      <!-- PAGE 4 -->
      <div class="notebook-sheet" id="sheet-4">
        <textarea class="notebook-text" placeholder="Things we will do..."></textarea>
        <div class="audio-widget">
          <span>🎵</span>
          <span class="audio-filename">No audio attached</span>
          <label class="btn-tool" style="padding: 3px 8px; font-size: 0.7rem;">
            Upload
            <input type="file" class="audioInput" accept="audio/*" style="display: none;">
          </label>
          <button class="btn-tool btnPlay" style="padding: 3px 8px; font-size: 0.7rem;" disabled>Play</button>
        </div>
      </div>

      <!-- PAGE 5 -->
      <div class="notebook-sheet" id="sheet-5">
        <textarea class="notebook-text" placeholder="Forever yours..."></textarea>
        <div class="audio-widget">
          <span>🎵</span>
          <span class="audio-filename">No audio attached</span>
          <label class="btn-tool" style="padding: 3px 8px; font-size: 0.7rem;">

            <input type="file" class="audioInput" accept="audio/*" style="display: none;">

    </div>

  <!-- Bottom Controls & Page Navigation -->
  <div class="bottom-controls">
    <div class="tool-buttons" id="toolBarContainer" style="display: none;">
      <label class="btn-tool">
        📷 Add Photo
        <input type="file" id="photoInput" accept="image/*" style="display: none;">
      </label>
      <button class="btn-tool" id="btnSave">💾 Save Page</button>
    </div>

    <div class="nav-bar">
      <button class="btn-nav" id="btnPrev">‹</button>
      <span class="page-indicator" id="pageIndicator">Cover</span>
      <button class="btn-nav" id="btnNext">›</button>
    </div>
  </div>

  <audio id="bgAudio"></audio>

  <!-- Script Logic -->
  <script>
    let currentPage = 0;
    const totalPages = 5;
    let pageData = {};
    let activeAudioData = {};
    let currentPlayingAudio = null;

    const bookPage = document.getElementById('bookPage');
    const pageIndicator = document.getElementById('pageIndicator');
    const toolBarContainer = document.getElementById('toolBarContainer');
    const syncStatus = document.getElementById('syncStatus');

    // Navigation Buttons with 3D Page Turn Animation
    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentPage > 0) {
        turnPage(currentPage - 1);
      }
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentPage < totalPages) {
        turnPage(currentPage + 1);
      }
    });

    function turnPage(targetPage) {
      // Trigger flip animation effect
      bookPage.classList.add('page-turning');

      setTimeout(() => {
        document.getElementById(`sheet-${currentPage}`).classList.remove('active');
        currentPage = targetPage;
        document.getElementById(`sheet-${currentPage}`).classList.add('active');
        
        updateUIState();

        // Remove animation class
        bookPage.classList.remove('page-turning');
      }, 300);
    }

    function updateUIState() {
      if (currentPage === 0) {
        pageIndicator.textContent = "Cover";
        toolBarContainer.style.display = "none";
      } else {
        pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
        toolBarContainer.style.display = "flex";
      }
      loadPageContent(currentPage);
    }

    // Load Data for Current Page
    function loadPageContent(page) {
      if (page === 0) return;

      const sheet = document.getElementById(`sheet-${page}`);
      const textarea = sheet.querySelector('.notebook-text');
      const filenameSpan = sheet.querySelector('.audio-filename');
      const playBtn = sheet.querySelector('.btnPlay');

      const data = pageData[page] || { text: '', audio: null, audioName: '', photos: [] };
      textarea.value = data.text || '';

      if (data.audioName) {
        filenameSpan.textContent = data.audioName;
        activeAudioData[page] = data.audio;
        playBtn.disabled = false;
      } else {
        filenameSpan.textContent = "No audio attached";
        playBtn.disabled = true;
      }

      // Clear existing photos on sheet
      sheet.querySelectorAll('.scrapbook-photo').forEach(el => el.remove());

      // Render photos
      if (data.photos) {
        data.photos.forEach(p => createPhotoElement(sheet, p.src, p.x, p.y, p.w));
      }
    }

    // Create Photo Element with Delete Button
    function createPhotoElement(sheet, src, x = 60, y = 40, w = 130) {
      const wrapper = document.createElement('div');
      wrapper.className = 'scrapbook-photo';
      wrapper.style.transform = `translate(${x}px, ${y}px)`;
      wrapper.style.width = `${w}px`;
      wrapper.setAttribute('data-x', x);
      wrapper.setAttribute('data-y', y);

      const img = document.createElement('img');
      img.src = src;
      wrapper.appendChild(img);

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete-photo';
      delBtn.textContent = '✕';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        wrapper.remove();
      };
      wrapper.appendChild(delBtn);

      sheet.appendChild(wrapper);
      makeInteractive(wrapper);
    }

    // Make Photos Draggable and Resizable via Touch
    function makeInteractive(element) {
      interact(element)
        .draggable({
          listeners: {
            move(event) {
              const target = event.target;
              const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
              const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
              target.style.transform = `translate(${x}px, ${y}px)`;
              target.setAttribute('data-x', x);
              target.setAttribute('data-y', y);
            }
          }
        })
        .resizable({
          edges: { left: true, right: true, bottom: true, top: true },
          listeners: {
            move(event) {
              let { x, y } = event.target.dataset;
              x = (parseFloat(x) || 0) + event.deltaRect.left;
              y = (parseFloat(y) || 0) + event.deltaRect.top;
              Object.assign(event.target.style, {
                width: `${event.rect.width}px`,
                transform: `translate(${x}px, ${y}px)`
              });
              Object.assign(event.target.dataset, { x, y });
            }
          }
        });
    }

    // Handle Photo Upload
    document.getElementById('photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && currentPage > 0) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const sheet = document.getElementById(`sheet-${currentPage}`);
          createPhotoElement(sheet, evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle Audio File Upload
    document.querySelectorAll('.audioInput').forEach((input, index) => {
      const pageNum = index + 1;
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            activeAudioData[pageNum] = evt.target.result;
            const sheet = document.getElementById(`sheet-${pageNum}`);
            sheet.querySelector('.audio-filename').textContent = file.name;
            sheet.querySelector('.btnPlay').disabled = false;
          };
          reader.readAsDataURL(file);
        }
      });
    });

    // Handle Audio Playback
    document.querySelectorAll('.btnPlay').forEach((btn, index) => {
      const pageNum = index + 1;
      btn.addEventListener('click', () => {
        if (activeAudioData[pageNum]) {
          if (currentPlayingAudio) currentPlayingAudio.pause();
          currentPlayingAudio = document.getElementById('bgAudio');
          currentPlayingAudio.src = activeAudioData[pageNum];
          currentPlayingAudio.play();
          btn.textContent = "Playing...";
          currentPlayingAudio.onended = () => { btn.textContent = "Play"; };
        }
      });
    });

    // Save Page Data to Firebase
    document.getElementById('btnSave').addEventListener('click', () => {
      if (currentPage === 0) return;

      const sheet = document.getElementById(`sheet-${currentPage}`);
      const photos = [];
      sheet.querySelectorAll('.scrapbook-photo').forEach(el => {
        photos.push({
          src: el.querySelector('img').src,
          x: parseFloat(el.getAttribute('data-x')) || 0,
          y: parseFloat(el.getAttribute('data-y')) || 0,
          w: parseFloat(el.style.width) || 130
        });
      });

      const currentData = {
        text: sheet.querySelector('.notebook-text').value,
        audio: activeAudioData[currentPage] || null,
        audioName: sheet.querySelector('.audio-filename').textContent !== "No audio attached" ? sheet.querySelector('.audio-filename').textContent : "",
        photos: photos
      };

      pageData[currentPage] = currentData;

      if (window.scrapbookDB) {
        const { database, ref, set } = window.scrapbookDB;
        set(ref(database, 'scrapbook/page_' + currentPage), currentData)
          .then(() => {
            syncStatus.textContent = "☁️ Saved & Synced";
            setTimeout(() => { syncStatus.textContent = "☁️ Synced"; }, 2500);
          });
      }
    });

    // Firebase Real-Time Synchronization Listener
    window.addEventListener('load', () => {
      let checkInterval = setInterval(() => {
        if (window.scrapbookDB) {
          clearInterval(checkInterval);
          const { database, ref, onValue } = window.scrapbookDB;
          
          onValue(ref(database, 'scrapbook'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
              for (let p = 1; p <= totalPages; p++) {
                if (data['page_' + p]) {
                  pageData[p] = data['page_' + p];
                }
              }
              if (currentPage > 0) loadPageContent(currentPage);
            }
          });
        }
      }, 300);
    });
  </script>
</body>
