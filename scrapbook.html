<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Digital Scrapbook</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Interact.js for Mobile Touch Dragging and Resizing -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- YOUR FIREBASE CONFIGURATION ---
    const firebaseConfig = {
  apiKey: "AIzaSyA4sRJWhiHLrLuZbOjMu5mHlr9zvVmJb2s",
  authDomain: "scrapbook-ba4cf.firebaseapp.com",
  projectId: "scrapbook-ba4cf",
  storageBucket: "scrapbook-ba4cf.firebasestorage.app",
  messagingSenderId: "657531881443",
  appId: "1:657531881443:web:6a561ab17133f04b6002d6",
  measurementId: "G-N8R7GS2NCG"
};

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    window.scrapbookDB = { database, ref, onValue, set };
  </script>

  <style>
    :root {
      --bg-color: #f7e8ea;
      --card-bg: #ffffff;
      --text-main: #2b2526;
      --text-muted: #7e6f71;
      --accent-pink: #e29ca3;
      --border-color: #ebd3d6;
      --line-blue: #c4dbe0;
      --margin-pink: #f2b3b8;
      --font-body: 'Inter', sans-serif;
      --font-hand: 'Caveat', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    /* Top Navigation Bar */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 10px 4px;
      z-index: 10;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .sync-badge {
      font-size: 0.75rem;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    /* Notebook Wrapper */
    .notebook-wrapper {
      width: 100%;
      max-width: 420px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 6px 0;
    }

    .book-page {
      width: 100%;
      height: 520px;
      background-color: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(180, 130, 135, 0.2);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;

      /* Full Page Lined Paper Pattern */
      background-image: 
        linear-gradient(to right, transparent 36px, var(--margin-pink) 36px, var(--margin-pink) 38px, transparent 38px),
        linear-gradient(to bottom, transparent 27px, var(--line-blue) 28px);
      background-size: 100% 28px;
      background-repeat: repeat;
    }

    /* Cover Sheet */
    .cover-sheet {
      width: 100%;
      height: 100%;
      display: none;
      background-color: var(--card-bg);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .cover-sheet.active {
      display: block;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lined Notebook Sheet Overlay */
    .notebook-sheet {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      padding-left: 44px;
      padding-right: 12px;
      padding-top: 28px;
      padding-bottom: 12px;
    }

    .notebook-sheet.active {
      display: block;
      animation: pageFade 0.25s ease-out;
    }

    @keyframes pageFade {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Textarea overlay seamlessly matching lines without scrollbars */
    .notebook-text {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-hand);
      font-size: 1.55rem;
      line-height: 28px;
      color: #2c2829;
      resize: none;
      white-space: pre-wrap;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }

    .notebook-text::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Photos */
    .scrapbook-photo {
      position: absolute;
      top: 40px;
      left: 60px;
      width: 130px;
      background: #ffffff;
      padding: 6px 6px 22px 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      border: 1px solid #eaeaea;
      touch-action: none;
      user-select: none;
      z-index: 5;
    }

    .scrapbook-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    .btn-delete-photo {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      background: #ff5c5c;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }

    /* Bottom Controls Layout */
    .bottom-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 0;
    }

    /* Audio Bar - Placed outside the book sheet */
    .audio-widget {
      width: 100%;
      height: 40px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .audio-filename {
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-tool {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .btn-tool:active {
      transform: scale(0.97);
      background-color: #f7eded;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-nav {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 44px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .page-indicator-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-input {
      width: 48px;
      padding: 4px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
    }

    .page-total {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar linking back to firstpage.html -->
  <div class="top-bar">
    <a href="firstpage.html" class="back-link">← Corner</a>
    <div class="sync-badge" id="syncStatus">☁️ Synced</div>
  </div>

  <!-- Notebook View Container -->
  <div class="notebook-wrapper">
    <div class="book-page" id="bookPage">
      
      <!-- Cover Page (Page 0) -->
      <div class="cover-sheet active" id="sheet-0">
        <img src="coverp.png" alt="Cover" class="cover-img">
      </div>

      <!-- 100 Dynamic Notebook Sheets -->
      <div id="pagesContainer"></div>

    </div>
  </div>

  <!-- Bottom Controls Container -->
  <div class="bottom-controls">
    
    <!-- Audio Bar (Hidden on Cover Page 0) -->
    <div class="audio-widget" id="audioWidget" style="display: none;">
      <span>🎵</span>
      <span class="audio-filename" id="audioFileName">No audio attached</span>
      <label class="btn-tool" style="padding: 3px 10px; font-size: 0.75rem;">
        Upload
        <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
      </label>
      <button class="btn-tool" id="btnPlayAudio" style="padding: 3px 10px; font-size: 0.75rem;" disabled>Play</button>
    </div>

    <!-- Action Tool Buttons -->
    <div class="tool-buttons" id="toolBarContainer" style="display: none;">
      <label class="btn-tool">
        📷 Add Photo
        <input type="file" id="photoInput" accept="image/*" style="display: none;">
      </label>
      <button class="btn-tool" id="btnSave">💾 Save Page</button>
    </div>

    <!-- Page Navigation Bar -->
    <div class="nav-bar">
      <button class="btn-nav" id="btnPrev">‹</button>
      <div class="page-indicator-wrapper">
        <input type="number" id="pageJumpInput" class="page-input" min="0" max="100" value="0">
        <span class="page-total">/ 100</span>
      </div>
      <button class="btn-nav" id="btnNext">›</button>
    </div>
  </div>

  <audio id="bgAudio"></audio>

  <!-- Script Logic -->
  <script>
    let currentPage = 0;
    const totalPages = 100;
    let pageData = {};
    let activeAudioData = {};
    let isPlaying = false;

    const pagesContainer = document.getElementById('pagesContainer');
    const pageJumpInput = document.getElementById('pageJumpInput');
    const toolBarContainer = document.getElementById('toolBarContainer');
    const audioWidget = document.getElementById('audioWidget');
    const audioFileName = document.getElementById('audioFileName');
    const btnPlayAudio = document.getElementById('btnPlayAudio');
    const audioFileInput = document.getElementById('audioFileInput');
    const syncStatus = document.getElementById('syncStatus');
    const bgAudio = document.getElementById('bgAudio');

    // Generate 100 Lined Sheets
    function generatePages() {
      for (let i = 1; i <= totalPages; i++) {
        const sheet = document.createElement('div');
        sheet.className = 'notebook-sheet';
        sheet.id = `sheet-${i}`;
        sheet.innerHTML = `<textarea class="notebook-text" placeholder="Write page ${i} memories here..."></textarea>`;
        pagesContainer.appendChild(sheet);
      }
    }

    generatePages();

    // Stop playback
    function stopCurrentAudio() {
      if (bgAudio) {
        bgAudio.pause();
        bgAudio.currentTime = 0;
        isPlaying = false;
        btnPlayAudio.textContent = "Play";
      }
    }

    // Page Switching
    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentPage > 0) turnPage(currentPage - 1);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentPage < totalPages) turnPage(currentPage + 1);
    });

    pageJumpInput.addEventListener('change', (e) => {
      let val = parseInt(e.target.value);
      if (isNaN(val)) val = 0;
      if (val < 0) val = 0;
      if (val > totalPages) val = totalPages;
      if (val !== currentPage) turnPage(val);
    });

    function turnPage(targetPage) {
      stopCurrentAudio();
      document.querySelector('.notebook-sheet.active, .cover-sheet.active')?.classList.remove('active');
      currentPage = targetPage;

      const targetSheet = document.getElementById(`sheet-${currentPage}`);
      if (targetSheet) targetSheet.classList.add('active');

      updateUIState();
    }

    function updateUIState() {
      pageJumpInput.value = currentPage;
      if (currentPage === 0) {
        toolBarContainer.style.display = "none";
        audioWidget.style.display = "none";
      } else {
        toolBarContainer.style.display = "flex";
        audioWidget.style.display = "flex";
        loadPageContent(currentPage);
      }
    }

    // Load Data for Page
    function loadPageContent(page) {
      if (page === 0) return;
      const sheet = document.getElementById(`sheet-${page}`);
      if (!sheet) return;

      const textarea = sheet.querySelector('.notebook-text');
      const data = pageData[page] || { text: '', audio: null, audioName: '', photos: [] };
      textarea.value = data.text || '';

      if (data.audioName) {
        audioFileName.textContent = data.audioName;
        activeAudioData[page] = data.audio;
        btnPlayAudio.disabled = false;
      } else {
        audioFileName.textContent = "No audio attached";
        btnPlayAudio.disabled = true;
      }

      sheet.querySelectorAll('.scrapbook-photo').forEach(el => el.remove());
if (data.photos) {
  data.photos.forEach(p => createPhotoElement(sheet, p.src, p.x, p.y, p.w, p.angle || 0));
}
    }

    // Photo Creation
    // Replace your old createPhotoElement function with this:
function createPhotoElement(sheet, src, x = 60, y = 40, w = 130, angle = 0) {
  const wrapper = document.createElement('div');
  wrapper.className = 'scrapbook-photo';
  wrapper.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
  wrapper.style.width = `${w}px`;
  wrapper.setAttribute('data-x', x);
  wrapper.setAttribute('data-y', y);
  wrapper.setAttribute('data-angle', angle);

  const img = document.createElement('img');
  img.src = src;
  wrapper.appendChild(img);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-delete-photo';
  delBtn.textContent = '✕';
  delBtn.onclick = (e) => {
    e.stopPropagation();
    wrapper.remove();
  };
  wrapper.appendChild(delBtn);

  sheet.appendChild(wrapper);
  makeInteractive(wrapper);
}
    }

    // Touch Dragging & Resizing
    // Replace your old makeInteractive function with this:
function makeInteractive(element) {
  interact(element)
    .draggable({
      listeners: {
        move(event) {
          const target = event.target;
          const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
          const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
          const angle = parseFloat(target.getAttribute('data-angle')) || 0;

          target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
          target.setAttribute('data-x', x);
          target.setAttribute('data-y', y);
        }
      }
    })
    .resizable({
      edges: { left: true, right: true, bottom: true, top: true },
      listeners: {
        move(event) {
          let { x, y } = event.target.dataset;
          x = (parseFloat(x) || 0) + event.deltaRect.left;
          y = (parseFloat(y) || 0) + event.deltaRect.top;
          const angle = parseFloat(event.target.getAttribute('data-angle')) || 0;

          Object.assign(event.target.style, {
            width: `${event.rect.width}px`,
            transform: `translate(${x}px, ${y}px) rotate(${angle}deg)`
          });
          Object.assign(event.target.dataset, { x, y });
        }
      }
    })
    .gesturable({
      listeners: {
        move(event) {
          const target = event.target;
          const x = parseFloat(target.getAttribute('data-x')) || 0;
          const y = parseFloat(target.getAttribute('data-y')) || 0;
          let angle = (parseFloat(target.getAttribute('data-angle')) || 0) + event.da;

          target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
          target.setAttribute('data-angle', angle);
        }
      }
    });
}

    // Photo Upload Listener
    document.getElementById('photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && currentPage > 0) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const sheet = document.getElementById(`sheet-${currentPage}`);
          createPhotoElement(sheet, evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Audio Upload Listener
    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && currentPage > 0) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          activeAudioData[currentPage] = evt.target.result;
          audioFileName.textContent = file.name;
          btnPlayAudio.disabled = false;
        };
        reader.readAsDataURL(file);
      }
    });

    // Audio Play/Pause Button
    btnPlayAudio.addEventListener('click', () => {
      if (isPlaying) {
        bgAudio.pause();
        isPlaying = false;
        btnPlayAudio.textContent = "Play";
      } else {
        if (activeAudioData[currentPage]) {
          bgAudio.src = activeAudioData[currentPage];
          bgAudio.play();
          isPlaying = true;
          btnPlayAudio.textContent = "Pause";
          bgAudio.onended = () => {
            btnPlayAudio.textContent = "Play";
            isPlaying = false;
          };
        }
      }
    });

    // Save Page Data to Firebase
    document.getElementById('btnSave').addEventListener('click', () => {
      if (currentPage === 0) return;

      const sheet = document.getElementById(`sheet-${currentPage}`);
      const photos = [];
      sheet.querySelectorAll('.scrapbook-photo').forEach(el => {
  photos.push({
    src: el.querySelector('img').src,
    x: parseFloat(el.getAttribute('data-x')) || 0,
    y: parseFloat(el.getAttribute('data-y')) || 0,
    w: parseFloat(el.style.width) || 130,
    angle: parseFloat(el.getAttribute('data-angle')) || 0
  });
});

      const currentData = {
        text: sheet.querySelector('.notebook-text').value,
        audio: activeAudioData[currentPage] || null,
        audioName: audioFileName.textContent !== "No audio attached" ? audioFileName.textContent : "",
        photos: photos
      };

      pageData[currentPage] = currentData;

      if (window.scrapbookDB) {
        const { database, ref, set } = window.scrapbookDB;
        set(ref(database, 'scrapbook/page_' + currentPage), currentData)
          .then(() => {
            syncStatus.textContent = "☁️ Saved & Synced";
            setTimeout(() => { syncStatus.textContent = "☁️ Synced"; }, 2500);
          });
      }
    });

    // Firebase Realtime Listener
    window.addEventListener('load', () => {
      let checkInterval = setInterval(() => {
        if (window.scrapbookDB) {
          clearInterval(checkInterval);
          const { database, ref, onValue } = window.scrapbookDB;
          
          onValue(ref(database, 'scrapbook'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
              for (let p = 1; p <= totalPages; p++) {
                if (data['page_' + p]) {
                  pageData[p] = data['page_' + p];
                }
              }
              if (currentPage > 0) loadPageContent(currentPage);
            }
          });
        }
      }, 300);
    });
  </script>
</body>
</html>
