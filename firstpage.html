<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>A Quiet Little Corner For Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #fbf5f6;
      --card-bg: #ffffff;
      --text-main: #4a3e3f;
      --text-muted: #8c7a7c;
      --accent-soft: #f4dada;
      --accent-pink: #e8b4b8;
      --accent-hover: #d8969b;
      --border-color: #eedede;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-handwritten: 'Caveat', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    html {
      height: -webkit-fill-available;
    }

    /* Floating Aesthetic Background Doodles */
    .bg-doodles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      color: var(--accent-pink);
      opacity: 0.35;
      animation: float 14s infinite ease-in-out;
      user-select: none;
    }

    /* Varied position, size, and animation delays for floating elements */
    .doodle-1 { top: 8%; left: 12%; font-size: 22px; animation-duration: 12s; animation-delay: 0s; }
    .doodle-2 { top: 15%; right: 14%; font-size: 16px; animation-duration: 16s; animation-delay: -2s; }
    .doodle-3 { top: 42%; left: 8%; font-size: 18px; animation-duration: 15s; animation-delay: -5s; }
    .doodle-4 { top: 68%; right: 10%; font-size: 24px; animation-duration: 13s; animation-delay: -3s; }
    .doodle-5 { bottom: 12%; left: 15%; font-size: 20px; animation-duration: 17s; animation-delay: -7s; }
    .doodle-6 { bottom: 18%; right: 18%; font-size: 15px; animation-duration: 11s; animation-delay: -4s; }
    .doodle-7 { top: 28%; right: 28%; font-size: 14px; animation-duration: 18s; animation-delay: -1s; }
    .doodle-8 { bottom: 35%; left: 22%; font-size: 19px; animation-duration: 14s; animation-delay: -6s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-18px) rotate(8deg) scale(1.05);
      }
    }

    /* Subtle ambient glowing orbs */
    .glow-orb {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 180, 184, 0.25) 0%, rgba(251, 245, 246, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .orb-1 { top: -40px; left: -40px; }
    .orb-2 { bottom: -60px; right: -60px; }

    /* Main Container Card */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Photo Frame Component */
    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 250px;
      aspect-ratio: 4/5;
      margin-bottom: 28px;
      padding: 10px 10px 32px 10px;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 30px -5px rgba(140, 122, 124, 0.12),
                  0 4px 12px -2px rgba(140, 122, 124, 0.06);
      border: 1px solid var(--border-color);
      transform: rotate(-1.5deg);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .photo-wrapper:hover, .photo-wrapper:active {
      transform: rotate(0deg) scale(1.01);
      box-shadow: 0 14px 36px -4px rgba(140, 122, 124, 0.16);
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      overflow: hidden;
      background-color: #f3e9ea;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tape-doodle {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 22px;
      background-color: rgba(255, 255, 255, 0.75);
      border: 1px dashed var(--accent-pink);
      backdrop-filter: blur(2px);
      z-index: 3;
      border-radius: 2px;
    }

    /* Typography */
    .title {
      font-family: var(--font-handwritten);
      font-size: 2.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 24px;
      letter-spacing: 0.5px;
