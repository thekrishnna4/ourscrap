<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>A Quiet Little Corner For Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #fbf5f6;
      --card-bg: #ffffff;
      --text-main: #3d3536;
      --text-muted: #8a7b7d;
      --accent-pink: #e2a8ad;
      --border-color: #e8d8da;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    html {
      height: -webkit-fill-available;
    }

    /* Floating Background Doodles Canvas Layer */
    .bg-doodles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      color: var(--accent-pink);
      opacity: 0.6;
      animation: floatAnimation 10s infinite ease-in-out;
      user-select: none;
      line-height: 1;
    }

    /* Positioning and Animation Speeds for Background Elements */
    .d1 { top: 10%; left: 10%; font-size: 20px; animation-duration: 9s; }
    .d2 { top: 18%; right: 12%; font-size: 16px; animation-duration: 12s; animation-delay: -2s; }
    .d3 { top: 45%; left: 8%; font-size: 14px; animation-duration: 11s; animation-delay: -4s; }
    .d4 { top: 65%; right: 10%; font-size: 22px; animation-duration: 10s; animation-delay: -1s; }
    .d5 { bottom: 12%; left: 14%; font-size: 18px; animation-duration: 13s; animation-delay: -5s; }
    .d6 { bottom: 20%; right: 16%; font-size: 15px; animation-duration: 8s; animation-delay: -3s; }
    .d7 { top: 30%; right: 25%; font-size: 12px; animation-duration: 14s; animation-delay: -6s; }
    .d8 { bottom: 38%; left: 20%; font-size: 17px; animation-duration: 10s; animation-delay: -2s; }

    @keyframes floatAnimation {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(10deg);
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Photo Frame Component */
    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 240px;
      aspect-ratio: 4/5;
      margin-bottom: 32px;
      padding: 10px 10px 28px 10px;
      background-color: var(--card-bg);
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(180, 150, 155, 0.12);
      border: 1px solid var(--border-color);
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      border-radius: 2px;
      overflow: hidden;
      background-color: #f5ebed;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Minimalist Headline */
    .title {
      font-family: var(--font-main);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--text-main);
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }

    /* Minimalist Rectangular Button */
    .btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.25s ease;
      width: 100%;
      max-width: 220px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .btn-enter:hover {
      background-color: #fffafb;
      border-color: var(--accent-pink);
    }

    .btn-enter:active {
      transform: scale(0.98);
      background-color: #f7eded;
    }
  </style>
</head>
<body>

  <!-- Visible Floating Background Doodles -->
  <div class="bg-doodles">
    <div class="doodle d1">♥</div>
    <div class="doodle d2">✦</div>
    <div class="doodle d3">✿</div>
    <div class="doodle d4">♥</div>
    <div class="doodle d5">✧</div>
    <div class="doodle d6">✦</div>
    <div class="doodle d7">♥</div>
    <div class="doodle d8">✿</div>
  </div>

  <!-- Main Content Layer -->
  <main class="container">
    
    <!-- Photo Frame with fp.jpeg -->
    <div class="photo-wrapper">
      <div class="photo-frame">
        <img src="fp.jpeg" alt="Us" id="landingPhoto">
      </div>
    </div>

    <!-- Minimalist Title -->
    <h1 class="title">a quiet little corner for us</h1>

    <!-- Minimalist Rectangular Button linking to scrapbook.html -->
    <a href="scrapbook.html" class="btn-enter">
      Open Our Scrapbook
    </a>

  </main>

</body>
</html>
