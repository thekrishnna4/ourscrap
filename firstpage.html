<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>A Quiet Little Corner For Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7e8ea; /* Soft blush pink */
      --card-bg: #ffffff;
      --text-main: #3d3536;
      --text-muted: #8a7b7d;
      --accent-pink: #df949b;
      --border-color: #e5c3c7;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    html {
      height: -webkit-fill-available;
    }

    /* Ambient Soft Pink Glow Orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
      opacity: 0.6;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      top: -60px;
      left: -60px;
      background: rgba(232, 160, 168, 0.45);
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: -80px;
      background: rgba(232, 160, 168, 0.45);
    }

    /* Floating Background Doodles Layer */
    .bg-doodles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      color: var(--accent-pink);
      opacity: 0.7;
      animation: floatAnimation 9s infinite ease-in-out;
      user-select: none;
      line-height: 1;
    }

    /* Additional Doodles & Layout Coordinates */
    .d1  { top: 8%;  left: 8%;   font-size: 22px; animation-duration: 8s;  animation-delay: 0s; }
    .d2  { top: 14%; right: 10%; font-size: 18px; animation-duration: 11s; animation-delay: -2s; }
    .d3  { top: 38%; left: 6%;   font-size: 16px; animation-duration: 10s; animation-delay: -4s; }
    .d4  { top: 62%; right: 8%;  font-size: 24px; animation-duration: 9s;  animation-delay: -1s; }
    .d5  { bottom: 10%; left: 12%; font-size: 20px; animation-duration: 12s; animation-delay: -5s; }
    .d6  { bottom: 16%; right: 14%; font-size: 16px; animation-duration: 7s;  animation-delay: -3s; }
    .d7  { top: 26%; right: 22%; font-size: 14px; animation-duration: 13s; animation-delay: -6s; }
    .d8  { bottom: 32%; left: 18%;  font-size: 19px; animation-duration: 9s;  animation-delay: -2s; }
    .d9  { top: 52%; left: 12%;  font-size: 15px; animation-duration: 10s; animation-delay: -3.5s; }
    .d10 { top: 78%; right: 28%; font-size: 21px; animation-duration: 11s; animation-delay: -1.5s; }
    .d11 { top: 5%;  right: 35%; font-size: 17px; animation-duration: 8.5s; animation-delay: -4.5s; }
    .d12 { bottom: 6%; right: 45%; font-size: 18px; animation-duration: 12.5s; animation-delay: -0.5s; }

    @keyframes floatAnimation {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-22px) rotate(12deg) scale(1.08);
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Gentle Entrance Fade-Up Animations */
    .fade-in-frame {
      opacity: 0;
      animation: entranceFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
    }

    .fade-in-title {
      opacity: 0;
      animation: entranceFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
    }

    .fade-in-btn {
      opacity: 0;
      animation: entranceFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.9s;
    }

    @keyframes entranceFadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Gently Floating Frame Component */
    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 240px;
      aspect-ratio: 4/5;
      margin-bottom: 32px;
      padding: 10px 10px 28px 10px;
      background-color: var(--card-bg);
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(210, 150, 158, 0.25);
      border: 1px solid var(--border-color);
      animation: floatFrame 6s ease-in-out infinite alternate;
    }

    @keyframes floatFrame {
      0% {
        transform: translateY(0px) rotate(-0.5deg);
      }
      100% {
        transform: translateY(-12px) rotate(0.8deg);
      }
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      border-radius: 2px;
      overflow: hidden;
      background-color: #f7e2e5;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Minimalist Headline */
    .title {
      font-family: var(--font-main);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--text-main);
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }

    /* Minimalist Rectangular Button */
    .btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.25s ease;
      width: 100%;
      max-width: 220px;
      box-shadow: 0 4px 12px rgba(210, 150, 158, 0.15);
    }

    .btn-enter:hover {
      background-color: #fff8f9;
      border-color: var(--accent-pink);
    }

    .btn-enter:active {
      transform: scale(0.98);
      background-color: #f3d8db;
    }
  </style>
</head>
<body>

  <!-- Ambient Pink Glow Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Rich Floating Background Doodles -->
  <div class="bg-doodles">
    <div class="doodle d1">♥</div>
    <div class="doodle d2">✦</div>
    <div class="doodle d3">✿</div>
    <div class="doodle d4">♥</div>
    <div class="doodle d5">✧</div>
    <div class="doodle d6">✦</div>
    <div class="doodle d7">♥</div>
    <div class="doodle d8">✿</div>
    <div class="doodle d9">✧</div>
    <div class="doodle d10">♥</div>
    <div class="doodle d11">❀</div>
    <div class="doodle d12">✦</div>
  </div>

  <!-- Main Content Layer -->
  <main class="container">
    
    <!-- Floating Frame Container with Page Load Animation -->
    <div class="fade-in-frame">
      <div class="photo-wrapper">
        <div class="photo-frame">
          <img src="fp.jpeg" alt="Us" id="landingPhoto">
        </div>
      </div>
    </div>

    <!-- Minimalist Title with Staggered Entrance -->
    <div class="fade-in-title">
      <h1 class="title">a quiet little corner for us</h1>
    </div>

    <!-- Minimalist Rectangular Button with Staggered Entrance -->
    <div class="fade-in-btn">
      <a href="scrapbook.html" class="btn-enter">
        Open Our Scrapbook
      </a>
    </div>

  </main>

</body>
</html>
